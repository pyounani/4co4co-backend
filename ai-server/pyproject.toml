[project]
name = "ai-server"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "accelerate==1.9.0",
    "aioboto3==15.1.0",
    "aiobotocore==2.24.0",
    "aiofiles==24.1.0",
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.12.15",
    "aioitertools==0.12.0",
    "aiosignal==1.4.0",
    "annotated-types==0.7.0",
    "anyio==4.10.0",
    "attrs==25.3.0",
    "boto3==1.39.11",
    "botocore==1.39.11",
    "certifi==2025.8.3",
    "cffi==1.17.1",
    "charset-normalizer==3.4.2",
    "click==8.2.1",
    "colorama==0.4.6",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "distro==1.9.0",
    "einops==0.8.1",
    "fastapi==0.116.1",
    "filelock==3.18.0",
    "fonttools==4.59.0",
    "frozenlist==1.7.0",
    "fsspec==2025.7.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httptools==0.6.4",
    "httpx==0.28.1",
    "huggingface-hub==0.34.3",
    "idna==3.10",
    "jinja2==3.1.6",
    "jiter==0.10.0",
    "jmespath==1.0.1",
    "joblib==1.5.1",
    "kiwisolver==1.4.8",
    "markupsafe==3.0.2",
    "matplotlib==3.10.5",
    "mpmath==1.3.0",
    "multidict==6.6.4",
    "networkx==3.5",
    "numpy==2.2.6",
    "openai==1.99.3",
    "opencv-python==4.12.0.88",
    "packaging==25.0",
    "pandas==2.3.1",
    "pillow==11.3.0",
    "propcache==0.3.2",
    "psutil==7.0.0",
    "py-cpuinfo==9.0.0",
    "pycparser==2.22",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "pydantic-core==2.33.2",
    "pyparsing==3.2.3",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.1.1",
    "pytz==2025.2",
    "pyyaml==6.0.2",
    "regex==2025.7.34",
    "requests==2.32.4",
    "s3transfer==0.13.1",
    "safetensors==0.6.1",
    "scikit-learn==1.7.1",
    "scipy==1.16.1",
    "seaborn==0.13.2",
    "six==1.17.0",
    "sniffio==1.3.1",
    "soundfile==0.13.1",
    "starlette==0.47.3",
    "sympy==1.14.0",
    "threadpoolctl==3.6.0",
    "timm==1.0.19",
    "tokenizers==0.21.4",
    "tqdm==4.67.1",
    "transformers==4.55.0",
    "typing-inspection==0.4.1",
    "typing-extensions==4.14.1",
    "tzdata==2025.2",
    "ultralytics==8.3.177",
    "ultralytics-thop==2.0.15",
    "urllib3==2.5.0",
    "uvicorn==0.35.0",
    "watchfiles==1.1.0",
    "websockets==15.0.1",
    "wrapt==1.17.3",
    "yarl==1.20.1",
]

[project.optional-dependencies]
cpu = [
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "torchvision==0.22.1",
]
gpu = [
    "torch==2.7.1+cu118",
    "torchaudio==2.7.1+cu118",
    "torchvision==0.22.1+cu118",
]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "gpu" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
